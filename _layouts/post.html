---
layout: default
---
{%- assign s = site.data.settings -%}
<div class="shortContainer">
  <a class="btn backButton" href="{{ '/' | relative_url }}" title="{{ s.heading }}"><h1>{{ s.heading }}</h1></a>
  <h1>▸ {{ page.title }}</h1>
</div>

<div class="shortContainer margin">
  <p class="meta">{{ page.date | date: "%d.%m.%Y" }}</p>

  {%- if page.video and page.video != "" %}
  {% include video.html url=page.video title=page.title %}
  {%- endif %}

  <div class="textbox md">{{ content }}</div>

  <div class="stack">
    <a class="btn backButton addBackArrow" href="{{ '/' | relative_url }}"><h4>{{ s.back }}</h4></a>
  </div>
</div>
